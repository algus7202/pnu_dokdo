<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독도 수호 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f9ff; /* Light Sky Blue */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="%231e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M10 13l4 4"/><path d="M10 17l4-4"/></svg>') 16 16, auto; /* Hammer-ish cursor fallback */
        }

        .serif {
            font-family: 'Noto Serif KR', serif;
        }

        /* Game Grid */
        .hole {
            position: relative;
            overflow: hidden;
            background: #d6d3d1; /* Stone color */
            border-radius: 50%;
            box-shadow: inset 0 10px 10px rgba(0,0,0,0.3);
            aspect-ratio: 1;
            cursor: pointer;
        }

        .hole::after {
            content: '';
            display: block;
            width: 100%;
            height: 20%;
            background: #a8a29e;
            position: absolute;
            bottom: -5%;
            left: 0;
            border-radius: 50%;
            z-index: 20;
        }

        /* The Enemy (Japanese Soldier Representation) */
        .enemy {
            position: absolute;
            bottom: -100%; /* Hidden initially */
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 80%;
            transition: bottom 0.2s ease-out;
            pointer-events: none; /* Let the click register on the hole/container wrapper logic if needed, or handle explicitly */
            z-index: 10;
        }

        .hole.up .enemy {
            bottom: 0;
            pointer-events: auto; /* Clickable when up */
        }

        /* SVG Soldier Icon */
        .soldier-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        /* Hammer Hit Effect */
        .bonk {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 60px;
            height: 60px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>') no-repeat center center;
            background-size: contain;
            transition: transform 0.1s;
            z-index: 30;
            pointer-events: none;
        }

        .hole.hit .enemy {
            transform: translateX(-50%) translateY(20px) rotate(15deg); /* React to hit */
            filter: grayscale(100%) brightness(50%);
        }
        
        .hole.hit .bonk {
            transform: translate(-50%, -50%) scale(1.5);
        }

        /* Custom Hammer Cursor when hovering over grid */
        .game-grid:active {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="%231e3a8a" stroke="white" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>'), auto; 
        }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header & Score -->
    <header class="text-center mb-8 space-y-2">
        <h1 class="text-4xl font-bold text-blue-900 serif">독도 수호 게임</h1>
        <p class="text-slate-600">숨어드는 침략자들을 막아내세요!</p>
        
        <div class="flex justify-center gap-8 mt-6">
            <div class="bg-white px-6 py-3 rounded-2xl shadow-lg border border-blue-100">
                <span class="block text-xs text-slate-400 uppercase font-bold">점수</span>
                <span class="text-3xl font-bold text-blue-600" id="scoreBoard">0</span>
            </div>
            <div class="bg-white px-6 py-3 rounded-2xl shadow-lg border border-red-100">
                <span class="block text-xs text-slate-400 uppercase font-bold">남은 시간</span>
                <span class="text-3xl font-bold text-red-500" id="timer">30</span>
            </div>
        </div>
    </header>

    <!-- Game Grid -->
    <div class="game-grid grid grid-cols-3 gap-4 md:gap-6 bg-blue-200/50 p-6 rounded-3xl shadow-inner max-w-lg w-full">
        <!-- Holes generated via JS or manual -->
        <div class="hole" id="hole1"><div class="bonk"></div><div class="enemy"></div></div>
        <div class="hole" id="hole2"><div class="bonk"></div><div class="enemy"></div></div>
        <div class="hole" id="hole3"><div class="bonk"></div><div class="enemy"></div></div>
        <div class="hole" id="hole4"><div class="bonk"></div><div class="enemy"></div></div>
        <div class="hole" id="hole5"><div class="bonk"></div><div class="enemy"></div></div>
        <div class="hole" id="hole6"><div class="bonk"></div><div class="enemy"></div></div>
        <div class="hole" id="hole7"><div class="bonk"></div><div class="enemy"></div></div>
        <div class="hole" id="hole8"><div class="bonk"></div><div class="enemy"></div></div>
        <div class="hole" id="hole9"><div class="bonk"></div><div class="enemy"></div></div>
    </div>

    <!-- Controls -->
    <div class="mt-8 flex gap-4">
        <button onclick="startGame()" id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:-translate-y-1 active:scale-95 text-lg">
            게임 시작!
        </button>
        <a href="index.html" class="bg-white hover:bg-slate-50 text-slate-600 font-bold py-3 px-8 rounded-full shadow-lg border border-slate-200 transform transition hover:-translate-y-1 text-lg">
            메인으로
        </a>
    </div>

    <!-- SVG Definitions for Reuse -->
    <svg style="display: none;">
        <!-- Japanese Soldier / Invader Icon (Cartoon Style) -->
        <symbol id="soldier-icon" viewBox="0 0 100 100">
            <!-- Cap -->
            <path d="M20,40 Q50,10 80,40 L85,45 L15,45 Z" fill="#5a5a3a" /> <!-- Army Green Cap -->
            <rect x="45" y="25" width="10" height="10" fill="#fcd34d" /> <!-- Star/Emblem -->
            <!-- Face -->
            <circle cx="50" cy="60" r="25" fill="#fde68a" />
            <!-- Moustache -->
            <rect x="40" y="70" width="20" height="4" rx="2" fill="#1f2937" />
            <!-- Eyes -->
            <circle cx="40" cy="55" r="3" fill="#1f2937" />
            <circle cx="60" cy="55" r="3" fill="#1f2937" />
            <!-- Body/Uniform Collar -->
            <path d="M25,80 Q50,90 75,80 L75,100 L25,100 Z" fill="#5a5a3a" />
        </symbol>
    </svg>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.querySelector('#scoreBoard');
        const timerDisplay = document.querySelector('#timer');
        const startBtn = document.getElementById('startBtn');
        
        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let countdown;
        let moleTimer;

        // Initialize Enemies
        document.querySelectorAll('.enemy').forEach(el => {
            el.innerHTML = `<svg class="soldier-svg"><use href="#soldier-icon"></use></svg>`;
            el.addEventListener('click', bonk);
        });

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = randomTime(500, 1000); // Speed
            const hole = randomHole(holes);
            hole.classList.add('up');
            
            moleTimer = setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            if (startBtn.disabled) return;
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            startBtn.textContent = "방어 중...";
            
            scoreBoard.textContent = 0;
            timeUp = false;
            score = 0;
            timeLeft = 30;
            timerDisplay.textContent = timeLeft;
            
            peep();
            
            countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timeUp = true;
                    startBtn.disabled = false;
                    startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    startBtn.textContent = "다시 시작!";
                    alert(`게임 종료! 최종 점수: ${score}점\n독도를 훌륭하게 지켜냈습니다!`);
                }
            }, 1000);
        }

        function bonk(e) {
            if(!e.isTrusted) return; // Cheater detection
            
            const hole = this.parentNode;
            
            // Prevent double clicking same pop-up
            if(hole.classList.contains('hit')) return;

            score += 10;
            scoreBoard.textContent = score;
            
            // Visual feedback
            hole.classList.remove('up');
            hole.classList.add('hit');
            
            // Play sound effect (Optional, muted for web policy safety, just visual here)
            
            setTimeout(() => {
                hole.classList.remove('hit');
            }, 400); // Animation reset time
        }

    </script>
</body>
</html>
