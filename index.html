<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독도, 우리 역사의 시작</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc; /* Very light slate */
        }
        
        .serif {
            font-family: 'Noto Serif KR', serif;
        }

        /* Custom Pastel Gradients */
        .bg-pastel-blue { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); }
        .bg-pastel-green { background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); }
        .bg-pastel-peach { background: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%); }
        
        /* Glassmorphism for cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <main class="max-w-6xl w-full space-y-12"> <!-- max-w-5xl에서 6xl로 넓혀서 4개 배치 최적화 -->

        <!-- Hero Section -->
        <section class="text-center space-y-6 animate-fade-in-up">
            <h1 class="text-4xl md:text-6xl font-bold text-slate-800 serif tracking-tight">
                대한민국의 아름다운 영토,<br>
                <span class="text-blue-500">독도</span>를 만나다
            </h1>
            <p class="text-lg text-slate-500 font-light max-w-2xl mx-auto">
                역사적 사실과 올바른 지식을 통해 독도를 바로 알고,<br>
                우리의 소중한 유산을 함께 지켜나가기 위한 공간입니다.
            </p>
        </section>

        <!-- Image Section -->
        <div class="w-full rounded-3xl overflow-hidden shadow-2xl shadow-blue-100/50 max-h-[400px] relative group">
