<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독도 의견 수렴</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff7ed; /* Very light orange/peach bg */
        }
        
        .serif {
            font-family: 'Noto Serif KR', serif;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fff; 
        }
        ::-webkit-scrollbar-thumb {
            background: #fdba74; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #fb923c; 
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-orange-100 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <a href="index.html" class="p-2 hover:bg-orange-50 rounded-full transition-colors text-slate-400 hover:text-orange-500" title="홈으로">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <h1 class="text-xl md:text-2xl font-bold text-slate-800 serif">독도, 우리의 목소리</h1>
            </div>
            <span class="text-xs md:text-sm bg-orange-100 text-orange-600 px-3 py-1 rounded-full font-medium">의견 수렴 게시판</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Left: Input Form -->
        <section class="md:col-span-1">
            <div class="bg-white rounded-2xl p-6 shadow-lg shadow-orange-100 border border-orange-50 sticky top-24">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <span>✏️</span> 의견 남기기
                </h2>
                <form id="opinionForm" class="space-y-4">
                    <div>
                        <label for="username" class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">작성자</label>
                        <input type="text" id="username" required placeholder="이름을 입력하세요"
                            class="w-full px-4 py-2 rounded-lg bg-slate-50 border border-slate-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-200 outline-none transition-all text-sm">
                    </div>
                    <div>
                        <label for="content" class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">내용</label>
                        <textarea id="content" rows="5" required placeholder="독도에 대한 생각이나 응원의 메시지를 남겨주세요."
                            class="w-full px-4 py-2 rounded-lg bg-slate-50 border border-slate-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-200 outline-none transition-all text-sm resize-none"></textarea>
                    </div>
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 text-white font-bold py-3 rounded-xl shadow-md transform transition active:scale-95 flex justify-center items-center gap-2">
                        <span>등록하기</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </form>
                <p class="text-xs text-slate-400 mt-4 text-center">
                    ※ 작성된 의견은 브라우저에 저장됩니다.
                </p>
            </div>
        </section>

        <!-- Right: Opinion List -->
        <section class="md:col-span-2 space-y-4">
            <div class="flex justify-between items-end mb-2 border-b border-orange-100 pb-2">
                <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                    <span>💬</span> 최근 의견 <span id="countBadge" class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full ml-1">0</span>
                </h2>
                <button onclick="clearAll()" class="text-xs text-slate-400 hover:text-red-400 underline transition-colors">전체 삭제</button>
            </div>

            <!-- List Container -->
            <div id="opinionList" class="space-y-4 min-h-[300px]">
                <!-- Items will be injected here -->
                <div class="text-center py-12 text-slate-400 bg-white/50 rounded-2xl border border-dashed border-slate-200">
                    아직 등록된 의견이 없습니다.<br>첫 번째 의견을 남겨주세요!
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-400 text-xs">
        &copy; 2024 Dokdo Sovereignty Project
    </footer>

    <script>
        const form = document.getElementById('opinionForm');
        const listContainer = document.getElementById('opinionList');
        const countBadge = document.getElementById('countBadge');
        const STORAGE_KEY = 'dokdo_opinions_v1';

        // 1. Load Data on Startup
        document.addEventListener('DOMContentLoaded', loadOpinions);

        // 2. Handle Form Submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nameInput = document.getElementById('username');
            const contentInput = document.getElementById('content');

            const newOpinion = {
                id: Date.now(),
                name: nameInput.value.trim(),
                content: contentInput.value.trim(),
                date: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' })
            };

            saveOpinion(newOpinion);
            
            // Reset form
            nameInput.value = '';
            contentInput.value = '';
            nameInput.focus();
        });

        // 3. Save to LocalStorage
        function saveOpinion(opinion) {
            const opinions = getOpinions();
            opinions.unshift(opinion); // Add to top
            localStorage.setItem(STORAGE_KEY, JSON.stringify(opinions));
            renderList(opinions);
        }

        // 4. Get from LocalStorage
        function getOpinions() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        // 5. Load & Render
        function loadOpinions() {
            const opinions = getOpinions();
            renderList(opinions);
        }

        // 6. Render Logic
        function renderList(opinions) {
            countBadge.textContent = opinions.length;

            if (opinions.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400 bg-white/50 rounded-2xl border border-dashed border-slate-200 flex flex-col items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <span>아직 등록된 의견이 없습니다.<br>첫 번째 의견을 남겨주세요!</span>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = '';
            
            opinions.forEach(op => {
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow fade-in relative group';
                
                // Random pastel avatar color
                const colors = ['bg-red-100 text-red-600', 'bg-blue-100 text-blue-600', 'bg-green-100 text-green-600', 'bg-purple-100 text-purple-600', 'bg-orange-100 text-orange-600'];
                const randomColor = colors[op.name.length % colors.length];

                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="w-10 h-10 rounded-full ${randomColor} flex items-center justify-center font-bold text-sm shrink-0">
                            ${op.name.charAt(0)}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-slate-800 text-sm">${op.name}</h3>
                                    <span class="text-xs text-slate-400">${op.date}</span>
                                </div>
                                <button onclick="deleteOpinion(${op.id})" class="text-slate-300 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity" title="삭제">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                            <p class="text-slate-600 text-sm mt-2 leading-relaxed whitespace-pre-wrap">${escapeHtml(op.content)}</p>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 7. Delete Item
        function deleteOpinion(id) {
            if(confirm('정말 이 의견을 삭제하시겠습니까?')) {
                const opinions = getOpinions().filter(op => op.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(opinions));
                renderList(opinions);
            }
        }

        // 8. Clear All
        function clearAll() {
            if(getOpinions().length === 0) return;
            if(confirm('모든 의견을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                localStorage.removeItem(STORAGE_KEY);
                renderList([]);
            }
        }

        // XSS Prevention helper
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
